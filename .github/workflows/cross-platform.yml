name: Android and Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install app workloads
        run: dotnet workload install maui-android maui-windows

      - name: Run shared core checks
        run: dotnet run --project CrossPlatform/HanziDeck.CoreChecks/HanziDeck.CoreChecks.csproj --configuration Release

      - name: Build Android app
        run: dotnet build CrossPlatform/HanziDeck/HanziDeck.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk

      - name: Build Windows app
        run: dotnet build CrossPlatform/HanziDeck/HanziDeck.csproj -f net10.0-windows10.0.19041.0 -c Release -p:RuntimeIdentifierOverride=win-x64 -p:WindowsPackageType=None
