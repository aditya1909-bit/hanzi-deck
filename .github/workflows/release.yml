name: Publish macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Select release signing mode
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE_P12" && \
                -n "$MACOS_CERTIFICATE_PASSWORD" && \
                -n "$MACOS_SIGNING_IDENTITY" && \
                -n "$ASC_ISSUER_ID" && \
                -n "$ASC_KEY_ID" && \
                -n "$ASC_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No complete Developer ID configuration; publishing an ad-hoc signed build."
          fi

      - name: Install temporary signing credentials
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/DeveloperID.p12"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          security create-keychain -p temporary-password "$RUNNER_TEMP/hanzi-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/hanzi-signing.keychain-db"
          security unlock-keychain -p temporary-password "$RUNNER_TEMP/hanzi-signing.keychain-db"
          security import "$RUNNER_TEMP/DeveloperID.p12" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$RUNNER_TEMP/hanzi-signing.keychain-db"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k temporary-password \
            "$RUNNER_TEMP/hanzi-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/hanzi-signing.keychain-db"

      - name: Package signed downloads
        if: steps.signing.outputs.enabled == 'true'
        env:
          HANZI_DECK_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: ./Scripts/package_release.sh

      - name: Package ad-hoc signed downloads
        if: steps.signing.outputs.enabled != 'true'
        run: ./Scripts/package_release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/HanziDeck-macOS.dmg \
            dist/release/HanziDeck-macOS.zip \
            dist/release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Hanzi Deck $GITHUB_REF_NAME"

  cross-platform:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install app workloads
        run: dotnet workload install maui-android maui-windows

      - name: Run shared core checks
        run: dotnet run --project CrossPlatform/HanziDeck.CoreChecks/HanziDeck.CoreChecks.csproj --configuration Release

      - name: Create Android signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "hanzi-deck.keystore"
          if ($env:ANDROID_KEYSTORE_BASE64) {
            [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          } else {
            $env:ANDROID_KEY_ALIAS = "hanzi-deck"
            $env:ANDROID_KEY_PASSWORD = "temporary-release-key"
            $env:ANDROID_STORE_PASSWORD = "temporary-release-key"
            keytool -genkeypair -v -keystore $keyPath -alias $env:ANDROID_KEY_ALIAS -keyalg RSA -keysize 2048 -validity 10000 -storepass $env:ANDROID_STORE_PASSWORD -keypass $env:ANDROID_KEY_PASSWORD -dname "CN=Hanzi Deck"
          }
          "ANDROID_KEYSTORE_PATH=$keyPath" >> $env:GITHUB_ENV
          "ANDROID_KEY_ALIAS=$env:ANDROID_KEY_ALIAS" >> $env:GITHUB_ENV
          "ANDROID_KEY_PASSWORD=$env:ANDROID_KEY_PASSWORD" >> $env:GITHUB_ENV
          "ANDROID_STORE_PASSWORD=$env:ANDROID_STORE_PASSWORD" >> $env:GITHUB_ENV

      - name: Publish Android APK
        shell: pwsh
        run: |
          dotnet publish CrossPlatform/HanziDeck/HanziDeck.csproj -f net10.0-android -c Release `
            -p:AndroidPackageFormats=apk `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:ANDROID_KEYSTORE_PATH" `
            -p:AndroidSigningKeyAlias="$env:ANDROID_KEY_ALIAS" `
            -p:AndroidSigningKeyPass="$env:ANDROID_KEY_PASSWORD" `
            -p:AndroidSigningStorePass="$env:ANDROID_STORE_PASSWORD"
          $apk = Get-ChildItem CrossPlatform/HanziDeck/bin/Release/net10.0-android/publish -Filter "*-Signed.apk" | Select-Object -First 1
          if (-not $apk) { throw "Signed APK was not produced." }
          Copy-Item $apk.FullName "$env:RUNNER_TEMP/HanziDeck-Android.apk"

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish CrossPlatform/HanziDeck/HanziDeck.csproj -f net10.0-windows10.0.19041.0 -c Release `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            --self-contained true
          $publish = "CrossPlatform/HanziDeck/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish"
          Compress-Archive -Path "$publish/*" -DestinationPath "$env:RUNNER_TEMP/HanziDeck-Windows-x64.zip"

      - name: Collect downloads
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-downloads
          path: |
            ${{ runner.temp }}/HanziDeck-Android.apk
            ${{ runner.temp }}/HanziDeck-Windows-x64.zip
          if-no-files-found: error

  attach-cross-platform:
    needs: [release, cross-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v4
        with:
          name: cross-platform-downloads
          path: downloads

      - name: Add Android and Windows downloads to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" downloads/* --repo "$GITHUB_REPOSITORY" --clobber
