name: Publish macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Package downloads
        run: ./Scripts/package_release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/HanziDeck-macOS.dmg \
            dist/release/HanziDeck-macOS.zip \
            dist/release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Hanzi Deck $GITHUB_REF_NAME"
