name: macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build local app bundle
        run: ./Scripts/build_app.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: HanziDeck-macOS
          path: dist/HanziDeck.app
          if-no-files-found: error
