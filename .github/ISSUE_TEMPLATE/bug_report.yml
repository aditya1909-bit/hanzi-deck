name: Bug report
description: Report behavior that is broken or unexpected.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a deck
        2. Choose...
        3. See...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: macOS and app version
      placeholder: macOS 14.6, commit abc1234
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Screenshots are welcome, but remove personal study data first.
